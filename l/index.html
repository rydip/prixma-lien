<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prixma — la liste de la maison</title>
<meta name="description" content="Rejoins la liste de courses de ta famille dans Prixma.">
<meta property="og:title" content="Prixma — la liste de la maison">
<meta property="og:description" content="Rejoins la liste de courses de ta famille dans Prixma.">
<meta property="og:image" content="https://rydip.github.io/prixma-lien/icon.png">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<style>
  :root { --fond: #F7F8F2; --encre: #182D27; --gris: #63756D; --vert: #237A57; --foret: #173E31; --citron: #D5EF82; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--fond); color: var(--encre);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 24px; }
  h1 { font-size: 30px; margin: 16px 0 6px; letter-spacing: -1px; }
  h1 span { color: var(--vert); }
  p { color: var(--gris); font-size: 15px; line-height: 22px; margin: 0 0 22px; }
  a.bouton { display: block; text-decoration: none; font-weight: 800; font-size: 16px; border-radius: 16px; padding: 16px; margin-top: 12px; }
  a[hidden] { display: none; }
  .ouvrir { background: var(--vert); color: #fff; }
  .store { background: var(--citron); color: var(--foret); }
  small { display: block; color: var(--gris); margin-top: 18px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <img src="../icon.png" alt="Logo Prixma">
  <h1>prixma<span>.</span></h1>
  <p id="texte">Ouverture de la liste dans l’app Prixma…</p>
  <a class="bouton ouvrir" id="ouvrir" href="#">Ouvrir dans Prixma</a>
  <a class="bouton store" href="https://play.google.com/store/apps/details?id=ma.prixma.app">Télécharger Prixma sur Google Play</a>
  <small>Prixma compare les prix de Marjane, Carrefour et Aswak Assalam.</small>
</main>
<script>
  // Invitation de la liste de la maison. Comme la page produit, Android
  // ouvre l'app par intent, avec le Play Store en secours.
  (function () {
    var PLAY = 'https://play.google.com/store/apps/details?id=ma.prixma.app';
    var code = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-HJKMNP-Z2-9]/g, '');
    var lien = document.getElementById('ouvrir');
    if (code.length !== 8) {
      document.getElementById('texte').textContent = 'Ce code est invalide. Demande un nouveau code à ta famille.';
      lien.hidden = true;
      return;
    }
    var chemin = 'liste/' + code;
    var android = /Android/i.test(navigator.userAgent);
    var intent = 'intent://' + chemin + '#Intent;scheme=prixma;package=ma.prixma.app;S.browser_fallback_url='
      + encodeURIComponent(PLAY) + ';end';
    lien.href = android ? intent : 'prixma://' + chemin;
    if (android) {
      location.replace(intent);
      setTimeout(function () {
        document.getElementById('texte').textContent = 'L’app ne s’est pas ouverte ? Touche le bouton, ou installe Prixma. Dans Ma liste, choisis « J’ai un code » : ' + code.slice(0, 4) + '-' + code.slice(4) + '.';
      }, 1500);
    } else {
      document.getElementById('texte').textContent = 'Cette liste s’ouvre dans l’app Prixma, sur Android. Ton code : ' + code.slice(0, 4) + '-' + code.slice(4) + '.';
    }
  })();
</script>
</body>
</html>
