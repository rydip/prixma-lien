<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prixma — compare les prix au Maroc</title>
<meta name="description" content="Ouvre ce produit dans Prixma : ses prix chez Marjane, Carrefour et Aswak Assalam.">
<meta property="og:title" content="Prixma — compare les prix au Maroc">
<meta property="og:description" content="Ouvre ce produit dans Prixma : ses prix chez Marjane, Carrefour et Aswak Assalam.">
<meta property="og:image" content="https://rydip.github.io/prixma-lien/icon.png">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<style>
  :root { --fond: #F7F8F2; --encre: #182D27; --gris: #63756D; --vert: #237A57; --foret: #173E31; --citron: #D5EF82; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--fond); color: var(--encre);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 24px; }
  h1 { font-size: 30px; margin: 16px 0 6px; letter-spacing: -1px; }
  h1 span { color: var(--vert); }
  p { color: var(--gris); font-size: 15px; line-height: 22px; margin: 0 0 22px; }
  a.bouton { display: block; text-decoration: none; font-weight: 800; font-size: 16px; border-radius: 16px; padding: 16px; margin-top: 12px; }
  .ouvrir { background: var(--vert); color: #fff; }
  .store { background: var(--citron); color: var(--foret); }
  small { display: block; color: var(--gris); margin-top: 18px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <img src="../icon.png" alt="Logo Prixma">
  <h1>prixma<span>.</span></h1>
  <p id="texte">Ouverture du produit dans l’app Prixma…</p>
  <a class="bouton ouvrir" id="ouvrir" href="#">Ouvrir dans Prixma</a>
  <a class="bouton store" id="store" href="https://play.google.com/store/apps/details?id=ma.prixma.app">Télécharger Prixma sur Google Play</a>
  <small>Prixma compare les prix de Marjane, Carrefour et Aswak Assalam.</small>
</main>
<script>
  // Lien de partage d'une fiche (app/lib/lienProduit.ts). Sur Android, une
  // URL « intent » ouvre l'app si elle est installée, sinon Chrome suit le
  // lien de secours vers le Play Store. Ailleurs, les deux boutons.
  (function () {
    var PLAY = 'https://play.google.com/store/apps/details?id=ma.prixma.app';
    var id = new URLSearchParams(location.search).get('id');
    var chemin = /^\d{1,9}$/.test(id || '') ? 'produit/' + id : '';
    var android = /Android/i.test(navigator.userAgent);
    var intent = 'intent://' + chemin + '#Intent;scheme=prixma;package=ma.prixma.app;S.browser_fallback_url='
      + encodeURIComponent(PLAY) + ';end';
    var lien = document.getElementById('ouvrir');
    lien.href = android ? intent : 'prixma://' + chemin;
    if (android) {
      location.replace(intent);
      // Si rien ne s'est ouvert (navigateur qui bloque), les boutons restent là.
      setTimeout(function () {
        document.getElementById('texte').textContent = 'L’app ne s’est pas ouverte ? Touche le bouton, ou installe Prixma.';
      }, 1500);
    } else {
      document.getElementById('texte').textContent = 'Ce produit s’ouvre dans l’app Prixma, sur Android.';
    }
  })();
</script>
</body>
</html>
